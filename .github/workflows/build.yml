name: Build grok deb packages

on:
  push:
    tags:
    - "*"
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        image:
        - debian:12
        - debian:13
        host:
        - ubuntu-24.04-arm
        - ubuntu-24.04
    runs-on: ${{ matrix.host }}
    container:
      image: ${{ matrix.image }}
    steps:
    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends git build-essential cmake doxygen ruby libjpeg62-turbo-dev liblcms2-dev libtiff-dev libpng-dev pkgconf
        gem install fpm -v 1.17.0
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        submodules: recursive
    - name: git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: build
      id: build_deb
      run: ./build.sh
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        archive: false
        name: deb
        path: grok/build/grokj2k_*.deb
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        archive: false
        name: changes
        path: grok/build/grokj2k_*.changes

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${{ github.ref_name }}"
        if [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(0|[1-9][0-9]*)$ ]]; then
          prerelease_flag=""
        else
          prerelease_flag="--prerelease"
        fi
        gh release create "$tag" \
          --verify-tag \
          --notes "$tag" \
          --repo "${{ github.repository }}" \
          --draft \
          $prerelease_flag \
          --title "$tag" \
          artifacts/*
